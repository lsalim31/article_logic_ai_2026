# default.yaml - Baseline configuration for Logify experiments

############################################
# ALL MODELS AND THEIR PARAMETERS
############################################
models:
  sbert: "all-MiniLM-L6-v2"
  nli: "cross-encoder/nli-deberta-v3-large"
  reasoning: "gpt-5.2"
  translate: "openai/gpt-5-nano"

tokens:
  max_completion_tokens: 42000
  max_tokens: 42000
  chunk_target_size: 1500
  chunk_threshold: 500000

reasoning:
  effort: "medium"
  effort_translate: "low"
  temperature_logic_converter: 0.1
  temperature_translate: 0.3

############################################
# USED IN TRANSLATE
############################################
prompts:
  translation: "prompt_translate_march30"
  pass_1: "prompt_pass_1"
  pass_2: "prompt_pass_2"
  extraction: "prompt_long_openIE_Agn_nomodality"

retrieval:
  sbert_top_k: 10
  sbert_min_similarity: 0.1
  hardness_constant: 0.9
  direct_retrieval_multiplier: 1 # do not modify. Changing it would break the chunks_for_translation = retrieved optimization.

## The following are not used. Used in Ignore_old/translate_old.py
nli:
  entailment_threshold: 0.5
  contradiction_threshold: 0.5
  batch_size: 32

############################################
# FEATURE FLAGS
############################################
# run 1 0000
# run 2 1001
# run 3 0101
# run 4 1100
# run 5 0011
# run 6 1010
# run 7 0110
# run 8 1111
features:
  ###############################
  use_shortcuts: false #factor Q1
  ###############################
  # next together Q2
  use_voting: true  
  expand_query_synonyms: true
  ###############################
  use_openie: false         # factor T1
  use_enrichment_kb: true  # factor T2
  ###############################

  use_subset: false         # always false

############################################
# NOT USED OR CHANGED
############################################
  enable_nli_filtering: false #used in Ignore_old/translate_old.py
  enable_hybrid_embedding: false
  enable_auto_negation_correction: false #not used
  enable_negation_warnings: 
  
synonyms:
  max_synonyms: 3

############################################
# ADAPTIVE VOTING
############################################
voting:
  trigger_query: 0.8
  additional_llm_query: 2

############################################
# SUBSET CONFIGURATION
############################################
subset:
  top_k_retrieval: 10
  num_clusters: 3
  top_per_cluster: 2
  entailment_threshold: 0.5

############################################
# CONFIDENCE THRESHOLDS
############################################
# The following are not used.
confidence:
  threshold_true: 0.55
  min_proposition_weight: 0.3

############################################
# DOCUMENT LIMITS
############################################
document:
  default_min_words: 100
  default_max_words: 400
